onboarding = false

[keys]
prefix = "ctrl+b"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "riskified.ignite.start-ticket"
description = "Ignite: start ticket"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: diff beside agent"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "File viewer"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"
description = "lazygit"

[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "k9s"
width = "90%"
height = "90%"
description = "k9s"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
sidebar_width = 30
accent = "#d4a36a"

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[experimental]
pane_history = true

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#d4a36a"
text = "#bfac99"
subtext0 = "#a08d7a"
overlay1 = "#94806d"
overlay0 = "#7d6a59"
surface0 = "#4d3b2e"
surface1 = "#5b4839"
surface_dim = "#42332a"
mauve = "#9672d4"
green = "#709855"
yellow = "#e2c358"
red = "#ce574a"
blue = "#63a2d6"
teal = "#72aaa8"
peach = "#cf8a5a"
